<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" role="img" aria-label="Terminal session introducing Rohan Sirohi, DevOps and Infrastructure Engineer">
  <title>rohan@spraxa:~/infrastructure</title>

  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2128"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="win"><rect x="10" y="10" width="600" height="400" rx="10"/></clipPath>
  </defs>

  <style>
    .t  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .ui { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.5px; fill: #7d8590; }
    .p  { fill: #3fb950; }            /* prompt */
    .c  { fill: #e6edf3; }            /* command */
    .o  { fill: #8b949e; }            /* output */
    .ok { fill: #3fb950; }            /* status dot */
    .b  { fill: #58a6ff; }            /* highlight */
    .y  { fill: #d29922; }            /* numbers */
    .cov { fill: #0d1117; transform-box: fill-box; transform-origin: 100% 50%; }
    .cur { fill: #3fb950; transform-box: fill-box; opacity: 0; }

    /* ---- typed command lines (steps = char count) ---- */
    @keyframes c1  { 0%,3.08%   { transform: scaleX(1) } 10.77%,100% { transform: scaleX(0) } }
    @keyframes c3  { 0%,16.92%  { transform: scaleX(1) } 26.15%,100% { transform: scaleX(0) } }
    @keyframes c5  { 0%,33.08%  { transform: scaleX(1) } 44.62%,100% { transform: scaleX(0) } }
    /* ---- printed output lines (fast wipe) ---- */
    @keyframes c2  { 0%,12.31%  { transform: scaleX(1) } 14.23%,100% { transform: scaleX(0) } }
    @keyframes c4  { 0%,27.69%  { transform: scaleX(1) } 30.00%,100% { transform: scaleX(0) } }
    @keyframes c6  { 0%,46.15%  { transform: scaleX(1) } 48.46%,100% { transform: scaleX(0) } }
    @keyframes c7  { 0%,49.23%  { transform: scaleX(1) } 51.54%,100% { transform: scaleX(0) } }
    @keyframes c8  { 0%,52.31%  { transform: scaleX(1) } 54.62%,100% { transform: scaleX(0) } }
    @keyframes c9  { 0%,55.38%  { transform: scaleX(1) } 57.69%,100% { transform: scaleX(0) } }
    @keyframes c10 { 0%,58.46%  { transform: scaleX(1) } 60.77%,100% { transform: scaleX(0) } }

    /* ---- cursor rides the typed lines ---- */
    @keyframes k1 { 0%,3.08%  { transform: translateX(0);     opacity: 0 }
                    3.09%     { transform: translateX(0);     opacity: 1 }
                    10.77%    { transform: translateX(74px);  opacity: 1 }
                    10.78%,100% { transform: translateX(74px); opacity: 0 } }
    @keyframes k3 { 0%,16.92% { transform: translateX(0);     opacity: 0 }
                    16.93%    { transform: translateX(0);     opacity: 1 }
                    26.15%    { transform: translateX(156px); opacity: 1 }
                    26.16%,100% { transform: translateX(156px); opacity: 0 } }
    @keyframes k5 { 0%,33.08% { transform: translateX(0);     opacity: 0 }
                    33.09%    { transform: translateX(0);     opacity: 1 }
                    44.62%    { transform: translateX(221px); opacity: 1 }
                    44.63%,100% { transform: translateX(221px); opacity: 0 } }

    @keyframes show11 { 0%,63.08% { opacity: 0 } 63.09%,100% { opacity: 1 } }
    @keyframes blink  { 0%,63.8% { opacity: 0 }
                        63.9%,67%{ opacity: 1 } 70% { opacity: 0 } 73% { opacity: 1 }
                        76% { opacity: 0 } 79% { opacity: 1 } 82% { opacity: 0 }
                        85% { opacity: 1 } 88% { opacity: 0 } 91% { opacity: 1 }
                        94% { opacity: 0 } 97%,100% { opacity: 1 } }
    @keyframes pulse  { 0%,100% { opacity: .35 } 50% { opacity: 1 } }

    #cv1  { animation: c1  13s steps(8)  infinite both }
    #cv2  { animation: c2  13s steps(24) infinite both }
    #cv3  { animation: c3  13s steps(17) infinite both }
    #cv4  { animation: c4  13s steps(26) infinite both }
    #cv5  { animation: c5  13s steps(24) infinite both }
    #cv6  { animation: c6  13s steps(25) infinite both }
    #cv7  { animation: c7  13s steps(25) infinite both }
    #cv8  { animation: c8  13s steps(21) infinite both }
    #cv9  { animation: c9  13s steps(25) infinite both }
    #cv10 { animation: c10 13s steps(24) infinite both }
    #cr1  { animation: k1  13s steps(8)  infinite both }
    #cr3  { animation: k3  13s steps(17) infinite both }
    #cr5  { animation: k5  13s steps(24) infinite both }
    #l11  { animation: show11 13s linear infinite both }
    #cr11 { animation: blink  13s linear infinite both }
    #live { animation: pulse 2s ease-in-out infinite }
  </style>

  <!-- window -->
  <rect x="10" y="10" width="600" height="400" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <g clip-path="url(#win)">
    <rect x="10" y="10" width="600" height="34" fill="url(#bar)"/>
  </g>
  <line x1="10" y1="44" x2="610" y2="44" stroke="#30363d" stroke-width="1"/>
  <circle cx="32" cy="27" r="5.5" fill="#ff5f56"/>
  <circle cx="52" cy="27" r="5.5" fill="#ffbd2e"/>
  <circle cx="72" cy="27" r="5.5" fill="#27c93f"/>
  <text class="ui" x="310" y="31" text-anchor="middle">rohan@spraxa: ~/infrastructure</text>
  <circle id="live" cx="588" cy="27" r="3.5" fill="#3fb950"/>

  <!-- ===== session ===== -->
  <g class="t">
    <!-- 1 -->
    <text x="40" y="72"><tspan class="p">$ </tspan><tspan class="c">whoami</tspan></text>
    <rect id="cv1" class="cov" x="40" y="58" width="74" height="20"/>
    <rect id="cr1" class="cur" x="40" y="59" width="9" height="17"/>

    <!-- 2 -->
    <text x="40" y="102"><tspan class="b">rohan sirohi</tspan><tspan class="o"> · devops &amp; infrastructure engineer</tspan></text>
    <rect id="cv2" class="cov" x="40" y="88" width="432" height="20"/>

    <!-- 3 -->
    <text x="40" y="132"><tspan class="p">$ </tspan><tspan class="c">uptime --career</tspan></text>
    <rect id="cv3" class="cov" x="40" y="118" width="156" height="20"/>
    <rect id="cr3" class="cur" x="40" y="119" width="9" height="17"/>

    <!-- 4 -->
    <text x="40" y="162"><tspan class="y">4+ yrs</tspan><tspan class="o"> · founding infra engineer @ spraxa solutions</tspan></text>
    <rect id="cv4" class="cov" x="40" y="148" width="469" height="20"/>

    <!-- 5 -->
    <text x="40" y="192"><tspan class="p">$ </tspan><tspan class="c">systemctl status --all</tspan></text>
    <rect id="cv5" class="cov" x="40" y="178" width="221" height="20"/>
    <rect id="cr5" class="cur" x="40" y="179" width="9" height="17"/>

    <!-- 6..10 -->
    <text x="40" y="222" xml:space="preserve"><tspan class="ok">● </tspan><tspan class="c">proxmox-cluster</tspan><tspan class="o">    </tspan><tspan class="ok">active</tspan><tspan class="o">   4 orgs · multi-node</tspan></text>
    <rect id="cv6" class="cov" x="40" y="208" width="451" height="20"/>

    <text x="40" y="252" xml:space="preserve"><tspan class="ok">● </tspan><tspan class="c">gocd-pipelines</tspan><tspan class="o">     </tspan><tspan class="ok">active</tspan><tspan class="o">   100+ ci/cd pipelines</tspan></text>
    <rect id="cv7" class="cov" x="40" y="238" width="460" height="20"/>

    <text x="40" y="282" xml:space="preserve"><tspan class="ok">● </tspan><tspan class="c">nginx-edge</tspan><tspan class="o">         </tspan><tspan class="ok">active</tspan><tspan class="o">   95+ domains</tspan></text>
    <rect id="cv8" class="cov" x="40" y="268" width="378" height="20"/>

    <text x="40" y="312" xml:space="preserve"><tspan class="ok">● </tspan><tspan class="c">observability</tspan><tspan class="o">      </tspan><tspan class="ok">active</tspan><tspan class="o">   prometheus · grafana</tspan></text>
    <rect id="cv9" class="cov" x="40" y="298" width="460" height="20"/>

    <text x="40" y="342" xml:space="preserve"><tspan class="ok">● </tspan><tspan class="c">edge-traffic</tspan><tspan class="o">       </tspan><tspan class="ok">active</tspan><tspan class="o">   ~1M requests / day</tspan></text>
    <rect id="cv10" class="cov" x="40" y="328" width="442" height="20"/>

    <!-- 11 -->
    <text id="l11" x="40" y="372"><tspan class="p">$</tspan></text>
    <rect id="cr11" class="cur" x="58" y="359" width="9" height="17" filter="url(#soft)"/>
  </g>
</svg>
